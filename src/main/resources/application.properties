spring.application.name=notification

server.port=7010

spring.datasource.url=jdbc:postgresql://localhost:5432/postgres?currentSchema=zaa

spring.datasource.username=postgres
spring.datasource.password=Ahmed@7
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.show-sql=true
spring.main.allow-circular-references=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC



logging.level.org.springframework.security=DEBUG
spring.security.enabled=false
logging.level.liquibase=DEBUG

spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.max-lifetime=180000
spring.datasource.hikari.connection-timeout=180000
spring.datasource.hikari.idle-timeout: 90000
spring.datasource.hikari.minimumIdle=0


spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

rabbitmq.exchange=payment.fanout.exchange
rabbitmq.queue=payment.notification.queue
